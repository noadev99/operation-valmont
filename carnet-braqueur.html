<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet du braqueur</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Carnet de poche du braqueur, toujours sombre (on joue dans le noir) : une colonne pour téléphone, 4 étapes en onglets. */
:root {
  --bg: #0b1018; --panel: #121b28; --panel2: #182436; --line: #2a3b55; --fg: #e9eef6; --muted: #8e9db2;
  --red: #ff5a47; --amber: #f0bd45; --green: #4fd38c; --blue: #5aa9ff;
  --display: "Saira Stencil One", Impact, "Arial Narrow", sans-serif;
  --body: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.45; }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 80px; display: grid; gap: 14px; }
header { display: grid; gap: 10px; }
.title { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.title b { font-family: var(--display); font-weight: 400; font-size: 1.7rem; line-height: 1; }
.title span { font: 600 .75rem var(--mono); color: var(--muted); letter-spacing: .1em; text-transform: uppercase; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.tabs button { background: var(--panel); color: var(--muted); border: 1px solid var(--line); padding: 8px 4px; font: 600 .78rem var(--mono); display: grid; gap: 2px; justify-items: center; }
.tabs button b { font-size: 1rem; }
.tabs button.on { background: var(--amber); color: #1a1204; border-color: var(--amber); }
.tabs button:disabled { opacity: .4; cursor: default; }
h2 { font-family: var(--display); font-weight: 400; font-size: 1.5rem; margin: 0; letter-spacing: .02em; }
p { margin: 0; }
.muted { color: var(--muted); }
.card { background: var(--panel); border: 1px solid var(--line); padding: 14px; display: grid; gap: 10px; }
.k { font-family: var(--mono); color: var(--amber); font-weight: 600; white-space: nowrap; }
input[type=text] { font: 500 1.05rem var(--body); background: var(--bg); color: var(--fg); border: 1px solid var(--line); padding: 12px; width: 100%; border-radius: 0; min-width: 0; }
.btn { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); padding: 12px 14px; font: 600 .95rem var(--mono); min-height: 46px; }
.btn.go { background: var(--amber); color: #1a1204; border-color: var(--amber); }
.btn.full { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > input { flex: 1 1 160px; }

/* rôles */
.roles { display: grid; gap: 8px; }
.role { text-align: left; background: var(--panel); color: var(--fg); border: 1px solid var(--line); padding: 10px; display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; align-items: start; }
.role > div { display: grid; gap: 6px; min-width: 0; }
.pic { display: block; width: 100%; aspect-ratio: 1; max-width: 100%; overflow: hidden; border: 1px solid var(--line); }
.pic svg { display: block; width: 100%; height: 100%; }
.me { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.me b { font-family: var(--display); font-weight: 400; font-size: 1.5rem; line-height: 1.05; display: block; }
.me span { color: var(--muted); font: 600 .8rem var(--mono); }
.role.on { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.role-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.role-top b { font-size: 1.05rem; }
.role-top span { font: 600 .78rem var(--mono); }
.hp { color: var(--red); } .en { color: var(--green); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; font: 500 .64rem var(--mono); color: var(--muted); }
.stats span { overflow: hidden; text-overflow: ellipsis; }
.stats span b { color: var(--amber); font-size: .9rem; display: block; }
.role small { color: var(--muted); font-size: .86rem; }
.role small b { color: var(--fg); }

/* matériel */
.points { display: flex; justify-content: space-between; align-items: center; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; background: var(--bg); padding-block: 8px; border-bottom: 1px solid var(--line); }
.points b { font: 700 1.6rem var(--mono); color: var(--amber); }
.items { display: grid; gap: 6px; }
.item { text-align: left; background: var(--panel); color: var(--fg); border: 1px solid var(--line); padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.item.on { border-color: var(--green); box-shadow: inset 3px 0 0 var(--green); }
.item b { font-size: .96rem; }
.item .cost { font: 700 .85rem var(--mono); color: var(--amber); grid-row: span 2; }
.item.on .cost { color: var(--green); }
.item small { color: var(--muted); font-size: .84rem; }
.item:disabled { opacity: .4; }
.gift { border-left: 3px solid var(--blue); padding: 6px 10px; font-size: .92rem; }

/* repérage */
.clock { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--panel); border: 1px solid var(--line); padding: 12px 14px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 3; }
.clock b { font: 700 2.2rem var(--mono); font-variant-numeric: tabular-nums; line-height: 1; }
.clock span { font: 600 .75rem var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.clock.late b { color: var(--red); }
.busy { border: 2px solid var(--amber); background: var(--panel); padding: 14px; display: grid; gap: 10px; }
.busy .bar { height: 8px; background: var(--panel2); }
.busy .bar i { display: block; height: 100%; background: var(--amber); }
.leads { display: grid; gap: 8px; }
.lead { text-align: left; background: var(--panel); color: var(--fg); border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 4px; }
.lead .lt { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.lead .lt b { font-size: 1rem; }
.lead .lt em { font-style: normal; font: 600 .78rem var(--mono); color: var(--muted); white-space: nowrap; }
.lead small { color: var(--muted); font-size: .86rem; }
.lead .meta { font: 600 .76rem var(--mono); color: var(--amber); }
.lead.new { border-color: var(--blue); }
.lead.new .lt b::after { content: " · nouveau"; color: var(--blue); font: 600 .72rem var(--mono); }
.lead:disabled { opacity: .45; cursor: default; }
.lead.done { opacity: .55; }
.boost { display: flex; gap: 10px; align-items: center; font-size: .92rem; }
.boost input { width: 22px; height: 22px; accent-color: var(--amber); }
.clue { border-left: 3px solid var(--green); background: var(--panel); padding: 10px 12px; display: grid; gap: 4px; }
.clue.ko { border-left-color: var(--muted); }
.clue b { font-size: .95rem; }
.clue p { font-size: .93rem; }
.clue .roll { font: 600 .74rem var(--mono); color: var(--muted); }
.clue .code { font: 700 .9rem var(--mono); color: var(--blue); }
.clue .mj { font: 600 .82rem var(--mono); color: var(--amber); }
.clue .gift { border-left-color: var(--blue); font-size: .88rem; }
.reveal { border: 2px solid var(--green); }
.reveal.ko { border-color: var(--red); }
.bigroll { font: 700 3rem var(--mono); line-height: 1; color: var(--amber); }

/* fiche */
.pool { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stp { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; border: 1px solid var(--line); background: var(--panel); }
.stp button { background: var(--panel2); color: var(--fg); border: 0; min-height: 52px; font: 700 1.3rem var(--mono); }
.stp div { text-align: center; display: grid; }
.stp div small { font: 600 .7rem var(--mono); color: var(--muted); letter-spacing: .1em; }
.stp div b { font: 700 1.3rem var(--mono); font-variant-numeric: tabular-nums; }
.skills { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.skill { background: var(--panel); border: 1px solid var(--line); color: var(--fg); padding: 12px; display: grid; gap: 2px; text-align: left; }
.skill b { font: 700 1.3rem var(--mono); color: var(--amber); }
.skill span { font-size: .9rem; }
.skill small { font: 500 .72rem var(--mono); color: var(--muted); }
.gearlist { display: grid; gap: 6px; }
.gearlist label { display: flex; gap: 10px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; font-size: .92rem; }
.gearlist input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--green); flex: none; }
.gearlist label.used { opacity: .5; text-decoration: line-through; }
.gearlist small { display: block; color: var(--muted); font-size: .82rem; text-decoration: none; }
.alertline { font: 600 .9rem var(--mono); color: var(--red); }
.danger { background: none; border: 1px solid var(--line); color: var(--muted); padding: 10px; font: 500 .82rem var(--mono); }
</style>

<div class="wrap">
  <header>
    <div class="title"><b>Carnet du braqueur</b><span id="who"></span></div>
    <nav class="tabs" id="tabs" aria-label="Étapes"></nav>
  </header>
  <main id="view"></main>
</div>

<script>
/* Portraits des 6 rôles — visages à facettes, éclairage dur, liseré de couleur.
   API : ValmontPortraits.svg(nomDuRôle) → chaîne SVG (viewBox 200×200). */
(function () {
  let uid = 0;
  const SK = { // clair, moyen, ombre, ombre profonde
    pale: ['#f0c6a2', '#d49c78', '#a66b4d', '#6c4333'],
    tan: ['#dba57a', '#b57c55', '#7f5238', '#4f3123'],
    olive: ['#d8ac82', '#b88a61', '#82603f', '#533a27'],
    dark: ['#a8714c', '#86553a', '#5c3826', '#3a231a'],
    deep: ['#8c5c3e', '#6c442e', '#4a2d1f', '#2e1c14'],
  };
  const pts = (a) => a.map((p) => p.join(',')).join(' ');
  const P = (a, fill, extra = '') => `<polygon points="${pts(a)}" fill="${fill}" ${extra}/>`;
  const L = (d, stroke, w = 1.5, extra = '') => `<path d="${d}" fill="none" stroke="${stroke}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${extra}/>`;
  const mirror = (a) => a.map(([x, y]) => [200 - x, y]);

  /* ---------- tête de base ---------- */
  function ears(s) {
    const r = [[131, 86], [139, 83], [141, 96], [135, 107], [129, 104]];
    return P(mirror(r), s[2]) + P([[63, 88], [61, 96], [66, 103]], s[3]) + P(r, s[1]) + P([[137, 88], [139, 96], [134, 103]], s[2]);
  }
  function neck(s, wide = 1) {
    const a = 14 * wide, b = 18 * wide;
    return P([[100 - a, 126], [100 + a, 126], [100 + b, 168], [100 - b, 168]], s[2]) + P([[100 - a, 126], [100 + a, 126], [100 + a - 4, 142], [100 - a + 4, 142]], s[3]);
  }
  function face(s) {
    const F = [
      [[[100, 36], [124, 44], [132, 62], [100, 58]], 0], [[[100, 36], [76, 44], [68, 62], [100, 58]], 1],
      [[[100, 58], [132, 62], [128, 78], [100, 76]], 0], [[[100, 58], [68, 62], [72, 78], [100, 76]], 1],
      [[[100, 76], [128, 78], [126, 85], [104, 83]], 1], [[[100, 76], [72, 78], [74, 85], [96, 83]], 2],
      [[[104, 83], [126, 85], [132, 95], [118, 99], [106, 95]], 1], [[[96, 83], [74, 85], [68, 95], [82, 99], [94, 95]], 2],
      [[[118, 99], [132, 95], [128, 116], [112, 112]], 0], [[[82, 99], [68, 95], [72, 116], [88, 112]], 2],
      [[[106, 95], [118, 99], [112, 112], [106, 101]], 1], [[[94, 95], [82, 99], [88, 112], [94, 101]], 2],
      [[[100, 106], [106, 101], [112, 112], [108, 118], [100, 116]], 1], [[[100, 106], [94, 101], [88, 112], [92, 118], [100, 116]], 2],
      [[[112, 112], [128, 116], [119, 133], [108, 142], [100, 145], [100, 125], [108, 118]], 1],
      [[[88, 112], [72, 116], [81, 133], [92, 142], [100, 145], [100, 125], [92, 118]], 2],
      [[[94, 126], [106, 126], [108, 141], [100, 145], [92, 141]], 1],
      [[[100, 82], [104, 83], [106, 101], [100, 107]], 0], [[[100, 82], [96, 83], [94, 101], [100, 107]], 1],
      [[[94, 101], [100, 107], [106, 101], [104, 108], [96, 108]], 2],
    ];
    return F.map(([a, i]) => P(a, s[i])).join('') + P([[96, 105], [99, 106], [98, 108]], s[3]) + P([[104, 105], [101, 106], [102, 108]], s[3]);
  }
  function eyes(o = {}) {
    const iris = o.iris || '#3a4a5a', lid = o.squint ? 1.4 : 0;
    const one = (cx, flip) => {
      const k = flip ? -1 : 1, X = (dx) => cx + dx * k;
      return P([[X(-8), 90], [X(-2), 87 + lid], [X(6), 88 + lid], [X(8), 91], [X(1), 93], [X(-5), 92.5]], '#efe7de')
        + `<circle cx="${X(0.5)}" cy="${90.4 + lid / 2}" r="${o.squint ? 2.2 : 2.7}" fill="${iris}"/><circle cx="${X(0.5)}" cy="${90.4 + lid / 2}" r="1.1" fill="#0b0b0d"/><circle cx="${X(1.6)}" cy="${89.4 + lid / 2}" r=".7" fill="#fff"/>`
        + P([[X(-8.5), 90], [X(-2), 86.5 + lid], [X(6.5), 87.5 + lid], [X(8.5), 91], [X(6), 89 + lid], [X(-2), 88.5 + lid]], o.liner || 'rgba(20,12,10,.85)');
    };
    return one(114, false) + one(86, true);
  }
  function brows(color, o = {}) {
    const t = o.thick || 0, r = [[104, 84], [117, 80 - t], [127, 82], [126, 85], [117, 83], [105, 87]];
    return P(r, color) + P(mirror(r), color);
  }
  function mouth(s, o = {}) {
    const up = o.smirk ? 3 : 0, lip = o.lip || s[1];
    return P([[89, 120], [95, 118], [100, 119], [105, 118], [111, 120 - up], [100, 121.5]], s[3]) + P([[91, 121], [110, 121 - up], [105, 125], [95, 125]], lip) + P([[95, 125], [105, 125], [103, 127], [97, 127]], s[2]);
  }
  function rim(color) {
    const outer = [[76, 44], [68, 62], [68, 94], [72, 116], [81, 133], [92, 142]];
    const inner = [[92, 142], [84, 132], [76, 115], [72.5, 94], [72.5, 63], [79, 46]];
    return P(outer.concat(inner), color, 'opacity=".65"');
  }
  function bg(p, accent) {
    return `<defs><radialGradient id="${p}g" cx="25%" cy="20%" r="85%"><stop offset="0" stop-color="${accent}" stop-opacity=".55"/><stop offset=".55" stop-color="#121a26"/><stop offset="1" stop-color="#070a10"/></radialGradient>
      <linearGradient id="${p}v" x1="0" y1="0" x2="0" y2="1"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></linearGradient></defs>
      <rect width="200" height="200" fill="url(#${p}g)"/>`
      + P([[0, 0], [70, 0], [0, 90]], accent, 'opacity=".12"') + P([[150, 0], [200, 0], [200, 40]], accent, 'opacity=".08"')
      + P([[0, 150], [40, 120], [20, 200], [0, 200]], '#fff', 'opacity=".03"');
  }
  const wrap = (w, inner) => w === 1 ? inner : `<g transform="translate(100 0) scale(${w} 1) translate(-100 0)">${inner}</g>`;
  function shoulders(main, light, dark, wide = 0) {
    const a = [[14 - wide, 200], [26 - wide, 162], [66 - wide / 2, 146], [100, 156], [134 + wide / 2, 146], [174 + wide, 162], [186 + wide, 200]];
    return P(a, main) + P([[100, 156], [134 + wide / 2, 146], [174 + wide, 162], [186 + wide, 200], [130, 200]], light) + P([[14 - wide, 200], [26 - wide, 162], [66 - wide / 2, 146], [74, 200]], dark);
  }

  /* ---------- les 6 personnages ---------- */
  const CHARS = {
    "Le Cerveau": { accent: '#f0bd45', draw(s) {
      let back = shoulders('#8a6b45', '#a2825a', '#6b5135') // trench
        + P([[66, 146], [100, 156], [84, 200], [70, 200]], '#5e472f') + P([[134, 146], [100, 156], [116, 200], [130, 200]], '#7d6140');
      back += neck(s);
      back += P([[83, 130], [117, 130], [121, 168], [100, 176], [79, 168]], '#1c1f25') + [138, 146, 154, 162].map((y) => L(`M${83 + (y - 130) * 0.1} ${y}H${117 - (y - 130) * 0.1 + 4}`, '#2b2f37', 1.2)).join('');
      let head = ears(s) + face(s) + eyes({ iris: '#6b7f8f' }) + brows('#8d9196', { thick: 1 })
        + P([[108, 40], [122, 46], [119, 52], [107, 47]], '#fff', 'opacity=".28"') // crâne qui brille
        + P([[69, 72], [74, 64], [78, 84], [71, 90]], '#9ca1a7') + P(mirror([[69, 72], [74, 64], [78, 84], [71, 90]]), '#b4b8bd')
        // barbe grise taillée
        + P([[100, 116], [112, 112], [127, 108], [125, 122], [115, 138], [100, 149]], '#b9bdc2') + P([[100, 116], [88, 112], [73, 108], [75, 122], [85, 138], [100, 149]], '#8b9097')
        + P([[100, 132], [112, 128], [108, 142], [100, 149], [92, 142], [88, 128]], '#a5a9ae')
        + P([[87, 115], [100, 110], [113, 115], [109, 119], [100, 116], [91, 119]], '#d3d6d9')
        + P([[94, 121], [106, 121], [104, 124], [96, 124]], s[1])
        // lunettes rondes teintées
        + `<circle cx="86" cy="90" r="10" fill="rgba(240,189,69,.22)" stroke="#c9a24a" stroke-width="1.8"/><circle cx="114" cy="90" r="10" fill="rgba(240,189,69,.22)" stroke="#c9a24a" stroke-width="1.8"/>`
        + L('M96 89Q100 86 104 89M124 89L136 86M76 89L64 86', '#c9a24a', 1.6)
        + P([[80, 84], [86, 82], [84, 86]], '#fff', 'opacity=".5"') + P([[108, 84], [114, 82], [112, 86]], '#fff', 'opacity=".5"')
        // oreillette
        + P([[136, 92], [141, 91], [141, 99], [136, 100]], '#16181c') + L('M139 100c3 4-3 6 0 10s-3 6 0 10-3 6 0 10 -2 8-2 14', '#16181c', 1.4);
      return { back, head };
    } },

    "Le Hacker": { accent: '#35d6e8', w: 0.93, draw(s) {
      let back = P([[56, 96], [62, 50], [100, 28], [138, 50], [144, 96], [152, 152], [48, 152]], '#20242c') // capuche
        + P([[100, 28], [138, 50], [144, 96], [152, 152], [120, 152]], '#272c35');
      back += shoulders('#2c313b', '#353b47', '#22262e') + neck(s, 0.9)
        + P([[76, 138], [100, 160], [124, 138], [118, 132], [100, 148], [82, 132]], '#1d2128')
        + L('M92 152V178M108 152V174', '#d8dde6', 1.6) + `<circle cx="92" cy="179" r="1.8" fill="#9aa3b0"/><circle cx="108" cy="175" r="1.8" fill="#9aa3b0"/>`;
      let head = ears(s) + face(s) + eyes({ iris: '#3a2a1f', liner: 'rgba(10,8,12,.95)' }) + brows('#1b1820')
        + mouth(s, { lip: '#9a5f4c' })
        // côté rasé
        + P([[68, 62], [76, 60], [76, 82], [68, 84]], s[2], 'opacity=".9"') + Array.from({ length: 14 }, (_, i) => `<circle cx="${69 + (i % 3) * 2.6}" cy="${64 + Math.floor(i / 3) * 4}" r=".5" fill="#1b1820"/>`).join('')
        // cheveux : mèche longue rabattue d'un côté
        + P([[74, 62], [78, 40], [100, 31], [126, 37], [141, 56], [142, 92], [134, 98], [132, 72], [120, 58], [100, 56], [84, 64]], '#1a1820')
        + P([[100, 31], [126, 37], [141, 56], [128, 52], [108, 42]], '#2b2733')
        + P([[96, 33], [110, 32], [126, 46], [114, 49]], '#35d6e8') // mèche néon
        + P([[126, 46], [141, 56], [142, 74], [134, 66]], '#2a9fb0', 'opacity=".7"')
        // code-barres tatoué sur la joue
        + [0, 2, 3, 5, 7, 8, 10].map((x) => `<rect x="${77 + x}" y="101" width="${x % 3 ? 0.8 : 1.4}" height="8" fill="#1c1a22" opacity=".8"/>`).join('')
        // monocle de visée hexagonal
        + `<polygon points="114,78 124,84 124,96 114,102 104,96 104,84" fill="rgba(53,214,232,.28)" stroke="#35d6e8" stroke-width="2"/>`
        + L('M124 90H134', '#35d6e8', 1.6) + L('M108 86l4 4M118 94l2-2', '#bff6fb', 1, 'opacity=".9"')
        + `<circle cx="104.5" cy="104.5" r="2.2" fill="none" stroke="#cfd6de" stroke-width="1"/>` // anneau de nez
        + `<circle cx="80" cy="81" r="1" fill="#cfd6de"/><circle cx="84" cy="79.5" r="1" fill="#cfd6de"/>`;
      return { back, head };
    } },

    "Le Perceur": { accent: '#ff8a3d', draw(s) {

<script>
/* Dé à 20 faces animé, avec le détail du calcul.
   ValmontDice.create(el, { d, mods: [{label, v}], dd, who, title, size })  → joue l'animation dans el
   ValmontDice.overlay(opts, onClose)                                     → même chose en fenêtre plein écran
   d : le dé (1 à 20) · mods : bonus ajoutés · dd : difficulté (facultatif, sinon on dit « annonce le total au MJ ») */
(function () {
  const CSS = `
  .vd{display:grid;gap:10px;justify-items:center;text-align:center;font-family:var(--mono,ui-monospace,Menlo,monospace);color:var(--fg,#e8eef6)}
  .vd-who{font-size:.8rem;color:var(--muted,#8a9ab0);letter-spacing:.06em}
  .vd-die{width:var(--vd,130px);height:var(--vd,130px);display:grid;place-items:center}
  .vd.big{--vd:170px}.vd.sm{--vd:84px}
  .vd-die svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45))}
  .vd-die .hex{fill:var(--vd-face,#1b2a40);stroke:var(--amber,#f0bd45);stroke-width:3;stroke-linejoin:round}
  .vd-die .tri{fill:rgba(255,255,255,.06);stroke:var(--amber,#f0bd45);stroke-width:2;stroke-linejoin:round}
  .vd-die .ed{stroke:var(--amber,#f0bd45);stroke-width:1.6;opacity:.8;fill:none}
  .vd-die .num{fill:var(--fg,#e8eef6);font:700 30px var(--mono,ui-monospace,Menlo,monospace);text-anchor:middle;dominant-baseline:central}
  .vd.rolling .vd-die{animation:vdtumble 1.55s cubic-bezier(.2,.7,.3,1) both}
  .vd.done .vd-die{animation:vdpop .4s ease-out both}
  .vd.n20 .hex{stroke:var(--green,#4fd38c);fill:#143a2a}.vd.n20 .num{fill:var(--green,#4fd38c)}
  .vd.n1 .hex{stroke:var(--red,#ff5a47);fill:#3a1a1a}.vd.n1 .num{fill:var(--red,#ff5a47)}
  @keyframes vdtumble{0%{transform:translateY(-70px) rotate(0) scale(.6)}25%{transform:translateY(10px) rotate(260deg) scale(1.08)}45%{transform:translateY(-34px) rotate(470deg) scale(1)}65%{transform:translateY(4px) rotate(640deg) scale(1.04)}80%{transform:translateY(-10px) rotate(700deg) scale(1)}100%{transform:translateY(0) rotate(720deg) scale(1)}}
  @keyframes vdpop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
  .vd-res{display:grid;gap:6px;justify-items:center;opacity:0;transform:translateY(8px);transition:opacity .35s,transform .35s}
  .vd.done .vd-res{opacity:1;transform:none}
  .vd-sum{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;font-weight:700}
  .vd-sum span{border:1px solid var(--line,#263650);padding:3px 8px;font-size:.82rem;background:rgba(255,255,255,.04)}
  .vd-sum span.t{border-color:var(--amber,#f0bd45);color:var(--amber,#f0bd45);font-size:1.5rem;padding:2px 12px}
  .vd-sum i{font-style:normal;color:var(--muted,#8a9ab0)}
  .vd-verdict{font:400 1.5rem "Saira Stencil One",Impact,sans-serif;letter-spacing:.03em}
  .vd-verdict.ok{color:var(--green,#4fd38c)}.vd-verdict.ko{color:var(--red,#ff5a47)}.vd-verdict.cost{color:var(--amber,#f0bd45)}
  .vd-line{font-size:.88rem;color:var(--muted,#8a9ab0);max-width:34ch;line-height:1.4}
  .vd-help{font-size:.8rem;color:var(--muted,#8a9ab0);max-width:36ch;text-align:left}
  .vd-help summary{cursor:pointer;text-align:center;font-weight:600}
  .vd-help p{margin:6px 0 0;line-height:1.45}
  .vd.sm .vd-verdict{font-size:1.1rem}.vd.sm .vd-sum span.t{font-size:1.1rem}
  .vd-ov{position:fixed;inset:0;z-index:100;background:rgba(3,6,10,.86);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
  .vd-card{background:var(--panel,#0f1622);border:2px solid var(--amber,#f0bd45);padding:20px 18px;width:min(380px,100%);display:grid;gap:14px}
  .vd-ok{background:var(--amber,#f0bd45);color:#1a1204;border:0;padding:12px;font:700 .95rem var(--mono,monospace);cursor:pointer;min-height:46px}
  @media (prefers-reduced-motion:reduce){.vd.rolling .vd-die,.vd.done .vd-die{animation:none}}`;
  if (typeof document !== 'undefined' && !document.getElementById('vd-style')) {
    const st = document.createElement('style'); st.id = 'vd-style'; st.textContent = CSS; document.head.appendChild(st);
  }
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const sgn = (n) => (n < 0 ? '−' + Math.abs(n) : '+' + n);
  const SHAPE = '<polygon class="hex" points="50,4 91,27 91,73 50,96 9,73 9,27"/><polygon class="tri" points="50,22 78,68 22,68"/>' +
    '<path class="ed" d="M50 22V4M50 22L9 27M50 22L91 27M78 68L91 27M78 68L91 73M78 68L50 96M22 68L9 27M22 68L9 73M22 68L50 96"/>';

  function verdict(d, total, dd, hide) {
    if (d === 20) return ['ok', 'Réussite spectaculaire !', '20 naturel : ça réussit toujours, et tu gagnes un bonus.'];
    if (d === 1) return ['ko', 'Catastrophe !', '1 naturel : ça rate toujours, et l\'alerte monte de 1.'];
    if (dd == null) return null;
    if (total >= dd) return ['ok', 'Réussi', hide ? 'Ton total est assez haut.' : `${total} atteint la difficulté ${dd}.`];
    if (dd - total <= 3) return ['cost', 'Raté de peu', hide ? 'Il s\'en est fallu de peu.' : `Il manque ${dd - total} : le MJ peut proposer de réussir avec un coût.`];
    return ['ko', 'Raté', hide ? 'Ce n\'est pas assez.' : `Il manque ${dd - total} pour atteindre ${dd}.`];
  }

  function create(el, o) {
    const mods = (o.mods || []).filter((m) => m.v);
    const total = o.d + mods.reduce((t, m) => t + m.v, 0);
    const v = verdict(o.d, total, o.dd, o.hideDd);
    const calm = typeof matchMedia !== 'undefined' && matchMedia('(prefers-reduced-motion: reduce)').matches;
    el.innerHTML = `<div class="vd ${o.size || ''} ${calm ? 'done' : 'rolling'} ${o.d === 20 ? 'n20' : o.d === 1 ? 'n1' : ''}">
      ${o.title ? `<div class="vd-who">${esc(o.title)}</div>` : ''}
      <div class="vd-die"><svg viewBox="0 0 100 100" aria-hidden="true">${SHAPE}<text class="num" x="50" y="56">${calm ? o.d : '?'}</text></svg></div>
      <div class="vd-res" aria-live="polite">
        <div class="vd-sum"><span>dé ${o.d}</span>${mods.map((m) => `<i>${m.v < 0 ? '−' : '+'}</i><span>${esc(m.label)} ${Math.abs(m.v)}</span>`).join('')}<i>=</i><span class="t">${total}</span></div>
        ${!v && o.quiet ? '' : v ? `<div class="vd-verdict ${v[0]}">${esc(v[1])}</div><div class="vd-line">${esc(v[2])}</div>` : `<div class="vd-line">Annonce <b>${total}</b> au MJ : c'est lui qui compare à la difficulté.</div>`}
        ${o.dd != null && !o.hideDd ? `<div class="vd-line">Difficulté : ${o.dd}</div>` : ''}
      </div>
      ${o.help === false ? '' : `<details class="vd-help"><summary>Comment ça marche ?</summary>
        <p><b>1.</b> Le dé a 20 faces : il donne un nombre de 1 à 20 au hasard.<br><b>2.</b> Tu ajoutes ta compétence (et les bonus : matériel, énergie, repérage).<br><b>3.</b> Si le total atteint la difficulté du MJ, c'est réussi.<br><b>4.</b> Un 20 réussit toujours, un 1 rate toujours.</p></details>`}
    </div>`;
    const root = el.querySelector('.vd');
    if (calm) return;
    const num = el.querySelector('.num');
    // le chiffre défile en ralentissant, puis s'arrête sur le résultat
    const steps = 15; let k = 0;
    const tick = () => {
      k++;
      if (k >= steps) { num.textContent = o.d; root.classList.remove('rolling'); root.classList.add('done'); if (o.onDone) o.onDone(); return; }
      num.textContent = 1 + Math.floor(Math.random() * 20);
      setTimeout(tick, 45 + k * k * 1.6);
    };
    setTimeout(tick, 120);
  }

  function overlay(o, onClose) {
    const ov = document.createElement('div');
    ov.className = 'vd-ov'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true');
    ov.innerHTML = '<div class="vd-card"><div class="vd-mount"></div><button class="vd-ok" type="button">OK</button></div>';
    document.body.appendChild(ov);
    create(ov.querySelector('.vd-mount'), Object.assign({ size: 'big' }, o));
    const btn = ov.querySelector('.vd-ok'); btn.focus();
    btn.onclick = () => { ov.remove(); if (onClose) onClose(); };
  }
  window.ValmontDice = { create, overlay };
})();

</script>
<script>
/* Relais en ligne entre appareils (téléphone des joueurs, console du MJ, télé), via ntfy.sh :
   un service public gratuit, sans compte. Chaque salon a son propre canal, nommé d'après son code.
   ValmontRelay.open(code, onMessage, onStatus) → { send(objet), close() }
   ValmontRelay.newCode()                       → un code de salon au hasard
   Une page publiée sur Claude ne peut pas appeler ce service : onStatus reçoit alors « off ». */
(function () {
  const HOST = 'https://ntfy.sh/';
  const topic = (code) => 'valmont-' + String(code).toLowerCase();
  function newCode() {
    const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    return Array.from({ length: 6 }, () => A[Math.floor(Math.random() * A.length)]).join('');
  }
  function open(code, onMessage, onStatus) {
    const url = HOST + topic(code);
    let es = null, closed = false, ok = true, seen = new Set();
    const say = (st) => { if (onStatus) onStatus(st); };
    function start() {
      if (closed) return;
      try { es = new EventSource(url + '/sse?since=all'); } catch (e) { say('off'); return; }
      es.onopen = () => say('on');
      es.onerror = () => say(ok ? 'retry' : 'off');
      es.onmessage = (ev) => {
        try {
          const m = JSON.parse(ev.data);
          if (m.event && m.event !== 'message') return;
          if (seen.has(m.id)) return; seen.add(m.id);
          onMessage(JSON.parse(m.message), (m.time || 0) * 1000);
        } catch (e) { /* message qui n'est pas pour nous */ }
      };
    }
    start();
    return {
      send(obj) {
        return fetch(url, { method: 'POST', body: JSON.stringify(obj) })
          .then((r) => { ok = r.ok; if (!r.ok) say('off'); return r.ok; })
          .catch(() => { ok = false; say('off'); return false; });
      },
      close() { closed = true; if (es) es.close(); },
    };
  }
  window.ValmontRelay = { open, newCode };
})();

</script>
<script>

  const norm = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const mmss = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const dur = (sec) => sec % 60 ? `${Math.floor(sec / 60)} min ${sec % 60} s` : `${sec / 60} min`;

  /* ---------- état (gardé sur ce téléphone) ---------- */
  // un carnet par joueur dans le même navigateur : #joueur1, #joueur2… (salle d'entraînement)
  const slot = (location.hash.match(/joueur(\d)/) || [])[1];
  const KEY = 'valmont-carnet' + (slot ? '-' + slot : '');
  const blank = () => ({ pid: 'p' + Math.random().toString(36).slice(2, 10), vts: 0, step: 'perso', name: '', role: -1, hp: 0, en: 0, gear: [], used: {}, prep: { tokens: 5, minutes: 15, start: 0, end: 0, cur: null, done: {}, open: [], penalty: 0, order: [] }, boost: false, last: null });
  let S = blank();
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(blank(), JSON.parse(raw)); S.prep = Object.assign(blank().prep, S.prep || {}); } catch (e) {}
  if (!S.pid) S.pid = 'p' + Math.random().toString(36).slice(2, 10);
  let lastHp = S.hp, lastEn = S.en, pushT = null;
  const save = () => {
    if (S.hp !== lastHp || S.en !== lastEn) { S.vts = Date.now(); lastHp = S.hp; lastEn = S.en; }
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
    clearTimeout(pushT); pushT = setTimeout(push, 600);
  };

  /* ---------- lien avec le MJ : même navigateur (salle d'entraînement) ou relais en ligne ---------- */
  const embedded = window.parent !== window;
  let room = '', relay = null, rstatus = '';
  try {
    const m = location.hash.match(/salon-([A-Za-z0-9]{4,10})/);
    if (m) { room = m[1].toUpperCase(); localStorage.setItem('valmont-salon', room); }
    else if (!embedded) room = localStorage.getItem('valmont-salon') || '';
  } catch (e) {}
  let bc = null; try { bc = new BroadcastChannel('valmont-roster'); bc.onmessage = (e) => onMJ(e.data); } catch (e) {}
  const ROOMS = {"C":"Couloir","S1":"Chambre forte","S2":"Sas laser","S3":"Quai du fourgon","S4":"Local électrique","S5":"Archives","S6":"Poste de garde","S7":"Chaufferie","R1":"Grand hall","R2":"Bureau Ferrand","R3":"Conseillers","R4":"Vestiaires","R5":"Comptage","R6":"PC sécurité","R7":"Service","F1":"Salon de réception","F2":"Open space","F3":"Bar du gala","F4":"Salle des serveurs","F5":"Office traiteur","F6":"Salle de réunion","F7":"Bureau Valmont","T1":"Verrière","T2":"Cabanon","T3":"Climatisation","T4":"Gaine","T5":"Antenne relais","T6":"Rebord est","T7":"Échelle"};
  const FLOOR_OF = { S: 'sous-sol', R: 'rdc', F: 'etage', T: 'toit' };
  let known = []; try { known = JSON.parse(localStorage.getItem('valmont-known') || '[]'); } catch (e) {}
  const cards = {}; // persos du salon (pour reprendre le sien)
  // sauvegarde compacte du perso : suffit à le retrouver sur un autre téléphone
  const snap = () => ({ tk: S.prep.tokens, g: S.gear, o: S.prep.open, pe: S.prep.penalty, or: S.prep.order, m: S.prep.minutes, s: S.prep.start, e: S.prep.end,
    d: Object.fromEntries(Object.entries(S.prep.done).map(([k, v]) => [k, [v.ok ? 1 : 0, v.d, v.mod, v.boost ? 1 : 0, v.total, v.gift || '']])) });
  const card = () => ({ k: 'p', id: S.pid, name: S.name, role: S.role >= 0 ? ROLES[S.role].name : '', hp: S.hp, en: S.en, gear: S.gear.concat(gifts()).slice(0, 12), ts: S.vts || 0, sv: snap() });
  function restoreFrom(c) {
    const ri = ROLES.findIndex((r) => r.name === c.role);
    if (ri < 0) return;
    const sv = c.sv || {};
    S = blank();
    S.pid = c.id; S.name = c.name; S.role = ri; S.hp = c.hp; S.en = c.en; S.vts = c.ts || 0; S.gear = sv.g || [];
    S.prep = Object.assign(S.prep, { tokens: sv.tk != null ? sv.tk : 5, open: sv.o || [], penalty: sv.pe || 0, order: sv.or || [], minutes: sv.m || 15, start: sv.s || 0, end: sv.e || 0,
      done: Object.fromEntries(Object.entries(sv.d || {}).map(([k, a]) => [k, { ok: !!a[0], d: a[1], mod: a[2], boost: !!a[3], total: a[4], gift: a[5] || null }])) });
    lastHp = S.hp; lastEn = S.en; S.step = 'fiche';
    save(); push(); render();
  }
  // message vers le MJ (même navigateur et relais)
  function send(o) {
    o.ts = Date.now(); o.mid = Math.random().toString(36).slice(2, 9);
    try { bc && bc.postMessage(o); } catch (e) {}
    if (relay) relay.send(o);
  }
  function push() {
    if (!S.name || S.role < 0) return;
    const c = card();
    try { const r = JSON.parse(localStorage.getItem('valmont-roster') || '{}'); r[S.pid] = c; localStorage.setItem('valmont-roster', JSON.stringify(r)); } catch (e) {}
    try { bc && bc.postMessage(c); } catch (e) {}
    if (relay) relay.send(c).then((ok) => { rstatus = ok ? 'sent' : 'off'; showRelay(); });
  }
  function onMJ(d) {
    if (!d) return;
    if (d.k === 'p') {
      if (d.id !== S.pid && d.name && d.role) { cards[d.id] = d; if (!embedded && S.step === 'perso' && S.role < 0 && !S.name && document.activeElement && document.activeElement.id !== 'name' && document.activeElement.id !== 'room') render(); }
    } else if (d.k === 'v') {
      known = Array.isArray(d.seen) ? d.seen : []; try { localStorage.setItem('valmont-known', JSON.stringify(known)); } catch (e) {}
      if (S.step === 'fiche' && !(document.activeElement && document.activeElement.id === 'goText')) render();
    } else if (d.k === 'c') {
      // le MJ lance le chrono de repérage : il démarre tout seul sur ce carnet
      const end = d.at + d.minutes * 60000;
      if (S.role >= 0 && !S.prep.start && S.prep.mjAt !== d.at && end - Date.now() > 5000) {
        S.prep.mjAt = d.at; S.prep.minutes = d.minutes; S.prep.start = Date.now(); S.prep.end = end; S.step = 'reperage'; save(); render();
      }
    } else if (d.k === 'm') {
      if (d.pid !== S.pid || (d.ts || 0) <= (S.vts || 0)) return;
      S.hp = d.hp; S.en = d.en; lastHp = S.hp; lastEn = S.en; S.vts = d.ts;
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      if (S.step === 'fiche') render();
    }
  }
  function startRelay() {
    if (relay) { relay.close(); relay = null; }
    if (!room || embedded || !window.ValmontRelay) return;
    relay = ValmontRelay.open(room, onMJ, (st) => { rstatus = st === 'on' && rstatus === 'sent' ? 'sent' : st; showRelay(); });
    push();
  }
  function showRelay() {
    const el = document.getElementById('relayState'); if (!el) return;
    el.textContent = !room ? '' : rstatus === 'sent' ? 'Relié au MJ ✓' : rstatus === 'on' ? 'Connecté au salon ' + room : rstatus === 'off' ? 'Relais indisponible : dis ton perso au MJ' : 'Connexion au salon ' + room + '…';
  }
  const role = () => ROLES[S.role];
  const spent = () => S.gear.reduce((t, n) => t + ((GEAR.find((g) => g[0] === n) || [0, 0])[1]), 0);
  const gifts = () => S.prep.order.map((id) => S.prep.done[id]).filter((r) => r && r.ok && r.gift).map((r) => r.gift);
  const lead = (id) => LEADS.find((l) => l.id === id);
  const visible = () => LEADS.filter((l) => !l.hidden || S.prep.open.includes(l.id));

  const $view = document.getElementById('view');
  const TABS = [['perso', '1', 'Perso'], ['matos', '2', 'Matériel'], ['reperage', '3', 'Repérage'], ['fiche', '4', 'Fiche']];
  function go(step) { S.step = step; save(); render(); window.scrollTo(0, 0); }

  function render() {
    document.getElementById('who').textContent = S.name ? S.name + (role() ? ' · ' + role().name : '') : '';
    document.getElementById('tabs').innerHTML = TABS.map(([k, n, l]) => `<button class="${S.step === k ? 'on' : ''}" data-tab="${k}" ${k !== 'perso' && S.role < 0 ? 'disabled' : ''}><b>${n}</b>${l}</button>`).join('');
    ({ perso, matos, reperage, fiche })[S.step]();
  }

  /* ---------- 1. perso ---------- */
  function restoreHtml() {
    const list = Object.values(cards).filter((c) => c.name && c.role);
    if (embedded || S.role >= 0 || S.name || !list.length) return '';
    return `<div class="card"><b>Reprendre mon perso</b><p class="muted" style="font-size:.88rem">Tu as déjà créé un perso dans ce salon ? Touche-le pour le retrouver, avec ses PV, son matériel et son repérage.</p>
      <div style="display:grid;gap:6px">${list.map((c) => `<button class="btn" data-restore="${esc(c.id)}">${esc(c.name)} · ${esc(c.role)}</button>`).join('')}</div></div>`;
  }
  function perso() {
    $view.innerHTML = `<div style="display:grid;gap:14px">
      <div class="card"><h2>Ton braqueur</h2>
        <label class="muted" for="name">Nom de code</label>
        <input type="text" id="name" maxlength="18" placeholder="Ex. : Le Chat" value="${esc(S.name)}" autocomplete="off"></div>
      ${embedded ? '' : `<div class="card"><label class="muted" for="room">Code du salon (affiché sur la télé)</label>
        <input type="text" id="room" maxlength="10" placeholder="Ex. : K7M2QX" value="${esc(room)}" autocomplete="off" autocapitalize="characters"><p class="muted" id="relayState" style="font-size:.85rem"></p></div>`}
      ${restoreHtml()}
      <p class="muted">Choisis un rôle. Mettez-vous d'accord avec ton équipe pour ne pas prendre le même.</p>
      <div class="roles">${ROLES.map((r, i) => `
        <button class="role ${S.role === i ? 'on' : ''}" data-role="${i}" aria-pressed="${S.role === i}">
          <span class="pic">${pic(r.name)}</span><div>
          <div class="role-top"><b>${r.name}</b><span><span class="hp">${r.hp} PV</span> · <span class="en">${r.en} EN</span></span></div>
          <div class="stats">${SKILLS.map((k, j) => `<span><b>+${r.s[j]}</b>${k}</span>`).join('')}</div>

    const rm = document.getElementById('room');
    if (rm) rm.addEventListener('input', () => { room = rm.value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10); try { localStorage.setItem('valmont-salon', room); } catch (e) {} rstatus = ''; if (room.length >= 4) startRelay(); else { if (relay) relay.close(); relay = null; } showRelay(); });
    showRelay();
    const nm = document.getElementById('name');
    nm.addEventListener('input', () => { S.name = nm.value.trim().slice(0, 18); save(); document.querySelector('[data-next]').disabled = S.role < 0 || !S.name; document.getElementById('who').textContent = S.name; });
  }

  /* ---------- 2. matériel ---------- */
  function matos() {
    const left = BUDGET - spent();
    const g = gifts();
    $view.innerHTML = `<div style="display:grid;gap:12px">
      <div class="points"><span>Points restants</span><b>${left} / ${BUDGET}</b></div>
      <p class="muted">Touche un objet pour le prendre ou le reposer. Talkie-walkie, cagoule et sac de sport sont fournis.</p>
      <div class="items">${GEAR.map(([n, c, d]) => { const on = S.gear.includes(n); return `
        <button class="item ${on ? 'on' : ''}" data-gear="${esc(n)}" aria-pressed="${on}" ${!on && c > left ? 'disabled' : ''}>
          <b>${esc(n)}</b><span class="cost">${on ? '✓ ' : ''}${c} pt${c > 1 ? 's' : ''}</span><small>${esc(d)}</small></button>`; }).join('')}</div>
      ${g.length ? `<div class="card"><b>Obtenu pendant le repérage</b>${g.map((x) => `<div class="gift">${esc(x)}</div>`).join('')}</div>` : ''}
      <button class="btn go full" data-next="reperage">Suivant : le repérage</button>
    </div>`;
  }

  /* ---------- 3. repérage ---------- */
  function reperage() {
    const P = S.prep, now = Date.now();
    if (!P.start) {
      $view.innerHTML = `<div style="display:grid;gap:14px">
        <div class="card"><h2>Le repérage</h2>
          <p>Avant le casse, tu as <b>5 jetons d'enquête</b>. Chaque piste coûte 1 jeton et se joue tout de suite : tu lances le dé et la télé retourne la carte.</p>
          <p>Tu ne pourras pas tout suivre : choisis bien, et partagez-vous les pistes avec ton équipe. Quand tu débloques une piste cachée, donne le <b>mot-clé</b> à tes coéquipiers. Un <b>20</b> au dé te rend ton jeton.</p></div>
        <button class="btn go full" id="startPrep">Commencer le repérage</button>
      </div>`;
      return;
    }
    const left = P.end - now, tk = P.tokens, over = (P.mjAt && left <= 0) || (tk <= 0 && !P.cur);
    const cur = P.cur && lead(P.cur.id);
    const res = S.last && P.done[S.last];
    $view.innerHTML = `<div style="display:grid;gap:12px">
      <div class="clock ${P.mjAt && left < 120000 ? 'late' : ''}"><div><span>Jetons d'enquête</span><br><b id="prepClock" style="letter-spacing:.15em">${'●'.repeat(Math.max(0, tk))}<span style="opacity:.25">${'●'.repeat(Math.max(0, 5 - tk))}</span></b>${P.mjAt ? ` <span class="muted" style="font-size:.8rem">· ${mmss(left)}</span>` : ''}</div><div style="text-align:right"><span>Pistes</span><br><b style="font-size:1.4rem">${Object.keys(P.done).length}</b></div></div>

        ${P.penalty ? `<p class="alertline">Pour le MJ : alerte de départ +${P.penalty} (tu t'es fait remarquer).</p>` : ''}</div>

      <b>${esc(l.t)}</b>
      <p>${esc(r.ok ? l.ok : l.ko)}</p>
      <span class="roll">dé ${r.d} + ${r.mod}${r.boost ? ' + 3' : ''} = ${r.total} (${esc(l.skill)})${r.d === 20 ? ' · jeton rendu' : ''}</span>
      ${r.ok && l.unlock ? l.unlock.map((u) => { const x = lead(u); return x ? `<span class="code">Nouvelle piste : ${esc(x.t)}. Mot-clé pour ton équipe : ${esc(x.code)}</span>` : ''; }).join('') : ''}

  /* ---------- 4. fiche ---------- */
  function moveHtml() {

  function fiche() {

    const items = S.gear.map((n) => GEAR.find((g) => g[0] === n)).filter(Boolean).map((g) => [g[0], g[2]]).concat(gifts().map((x) => [x, 'Obtenu pendant le repérage']));

    $view.innerHTML = `<div style="display:grid;gap:12px">

      <div class="card"><b>Lancer le d20</b><p class="muted" style="font-size:.88rem">Touche la compétence que le MJ te demande. Il te dira si tu as réussi.</p>
        <label class="boost"><input type="checkbox" id="fboost" ${S.en < 1 ? 'disabled' : ''}><span>Effort : <b>+3</b> pour 1 énergie</span></label>
        <div class="skills">${SKILLS.map((k, j) => `<button class="skill" data-roll="${j}"><small>${k}</small><b>+${r.s[j]}</b><span>Lancer</span></button>`).join('')}</div>
        <div id="froll" class="clue" hidden></div></div>
      <div class="card"><b>${esc(r.ab)}</b><p class="muted" style="font-size:.9rem">${esc(r.abd)}</p></div>
      <div style="display:grid;gap:8px"><h2>Matériel</h2>
        ${items.length ? `<div class="gearlist">${items.map(([n, d], i) => `<label class="${S.used[n] ? 'used' : ''}"><input type="checkbox" data-used="${esc(n)}" ${S.used[n] ? 'checked' : ''}><span>${esc(n)}<small>${esc(d)}</small></span></label>`).join('')}</div>` : '<p class="muted">Aucun matériel.</p>'}
        <p class="muted" style="font-size:.85rem">Coche un objet quand il est utilisé ou cassé.</p></div>
      <div style="display:grid;gap:8px"><h2>Ce que je sais</h2>
        ${clues.filter(([, x]) => x.ok).map(([l]) => `<div class="clue"><b>${esc(l.t)}</b><p>${esc(l.ok)}</p></div>`).join('') || '<p class="muted">Aucune info trouvée pendant le repérage.</p>'}</div>
      <button class="danger" id="resetAll">${confirmReset ? 'Toucher encore pour tout effacer' : 'Effacer ce carnet (nouvelle partie)'}</button>
    </div>`;
  }
  let confirmReset = false;

  /* ---------- actions ---------- */
  document.addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    const d = b.dataset;
    if (b.id !== 'resetAll') confirmReset = false;
    if (d.restore) { const c = cards[d.restore]; if (c) restoreFrom(c); return; }
    if (d.go != null) return askMove();
    if (d.tab) return go(d.tab);
    if (d.next) return go(d.next);
    if (d.role != null) { const r = ROLES[+d.role]; S.role = +d.role; S.hp = r.hp; S.en = r.en; save(); return render(); }
    if (d.gear) { const n = d.gear; S.gear = S.gear.includes(n) ? S.gear.filter((x) => x !== n) : S.gear.concat(n); if (spent() > BUDGET) S.gear.pop(); save(); return render(); }
    if (d.min) { S.prep.minutes = +d.min; save(); return render(); }
    if (b.id === 'startPrep') { S.prep.start = Date.now(); S.prep.end = S.prep.start + 3 * 3600000; save(); return render(); }
    if (d.lead) {
      const l = lead(d.lead);
      if (!l || S.prep.done[l.id] || S.prep.tokens <= 0) return;
      const boost = S.boost && S.en > 0;
      if (boost) S.en -= 1;
      S.prep.tokens -= 1;
      send({ k: 'b', pid: S.pid, who: S.name, id: l.id });
      const mod = role().s[SKILLS.indexOf(l.skill)] || 0, dd = l.dd;
      const dv = 1 + Math.floor(Math.random() * 20), total = dv + mod + (boost ? 3 : 0);
      const ok = dv === 20 || (dv !== 1 && total >= dd);
      S.prep.done[l.id] = { ok, d: dv, mod, boost, total, gift: ok ? l.gift : null };
      S.prep.order.push(l.id);
      if (ok && l.unlock) l.unlock.forEach((u) => { if (!S.prep.open.includes(u)) S.prep.open.push(u); });
      if (dv === 1) S.prep.penalty += 1;
      if (dv === 20) S.prep.tokens += 1;
      S.boost = false; S.last = l.id; save();
      const nat = dv === 20 ? 20 : dv === 1 ? 1 : 0;
      setTimeout(() => send({ k: 'r', pid: S.pid, who: S.name, id: l.id, t: l.t, ok, nat, mj: l.mj || '' }), 2600);
      ValmontDice.overlay({ d: dv, title: l.t, mods: [{ label: l.skill, v: mod }, { label: 'effort', v: boost ? 3 : 0 }], dd: l.dd, hideDd: true }, render);
      return;
    }
    if (b.id === 'okRes') { S.last = null; save(); return render(); }
    if (d.pool) { const r = role(), k = d.pool; S[k] = Math.max(0, Math.min(r[k], S[k] + Number(d.d))); save(); return render(); }
    if (d.roll != null) {
      const r = role(), j = +d.roll, fb = document.getElementById('fboost'), boost = fb && fb.checked && S.en > 0;
      if (boost) { S.en -= 1; save(); }
      const dv = 1 + Math.floor(Math.random() * 20), total = dv + r.s[j] + (boost ? 3 : 0);
      render();
      send({ k: 'd', pid: S.pid, who: S.name, skill: SKILLS[j], d: dv, mod: r.s[j] + (boost ? 3 : 0) });
      ValmontDice.overlay({ d: dv, title: S.name + ' · ' + SKILLS[j], mods: [{ label: SKILLS[j], v: r.s[j] }, { label: 'effort', v: boost ? 3 : 0 }] });
      return;
    }
    if (b.id === 'resetAll') { if (!confirmReset) { confirmReset = true; return render(); } confirmReset = false; try { const r = JSON.parse(localStorage.getItem('valmont-roster') || '{}'); delete r[S.pid]; localStorage.setItem('valmont-roster', JSON.stringify(r)); } catch (e) {} S = blank(); lastHp = S.hp; lastEn = S.en; save(); return render(); }
  });
  document.addEventListener('change', (e) => {
    if (e.target.id === 'boost') { S.boost = e.target.checked; save(); }
    if (e.target.dataset && e.target.dataset.used) { S.used[e.target.dataset.used] = e.target.checked; save(); render(); }
  });
  document.addEventListener('submit', (e) => {
    if (e.target.id !== 'codeForm') return;
    e.preventDefault();
    const v = norm(document.getElementById('code').value);
    const l = LEADS.find((x) => x.hidden && norm(x.code) === v);
    const msg = document.getElementById('codeMsg');
    if (!l) { msg.textContent = 'Ce mot-clé ne correspond à rien. Vérifie l\'orthographe.'; return; }
    if (S.prep.open.includes(l.id)) { msg.textContent = 'Tu as déjà cette piste.'; return; }
    S.prep.open.push(l.id); save(); render();
    const m2 = document.getElementById('codeMsg'); if (m2) m2.textContent = 'Nouvelle piste : ' + l.t;
  });

  // minuteurs
  setInterval(() => {
    if (S.step !== 'reperage' || !S.prep.start) return;
    const P = S.prep, now = Date.now();
    const clk = document.getElementById('prepClock');
    if (clk && false) clk.textContent = mmss(P.end - now);
    if (P.cur) {
      const l = lead(P.cur.id), left = P.cur.until - now;
      const bar = document.getElementById('busyBar'), lt = document.getElementById('busyLeft');
      if (bar && l) bar.style.width = Math.min(100, (1 - Math.max(0, left) / (l.sec * 1000)) * 100) + '%';
      if (lt) lt.textContent = mmss(left);
      if (left <= 0 && lt) render();
    } else if (P.end - now <= 0 && !document.querySelector('[data-next="fiche"]') && !S.last) render();
  }, 500);

  startRelay(); push();
  if (!LEADS.length) { $view.innerHTML = '<div class="card">Le carnet n\'a pas pu se charger. Recharge la page.</div>'; }
  else render();
})();
</script>
